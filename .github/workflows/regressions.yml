name: Document lifecycle regressions
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  regression-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install storage and extraction test dependencies
        run: python -m pip install pytest numpy 'lancedb==0.34.0' pyarrow typer pyyaml watchdog pillow pymupdf python-docx openpyxl python-pptx
      - name: Test without model downloads or autostart changes
        run: python -m pytest tests/test_document_lifecycle.py tests/test_watchlock.py tests/test_new_features.py tests/test_review_followups.py tests/test_extraction_integrity.py -q -rA

  cached-model-suite:
    strategy:
      fail-fast: false
      matrix:
        # Test both lancedb versions deployed on target machines (verdict 2026-10-27:
        # CI/deployment drift is a known flake class; see t_29120d00).
        lancedb: ['0.34.0', '0.36.0']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]' 'lancedb==${{ matrix.lancedb }}'
      - name: Cache real multilingual embedding model
        run: python -c "from huggingface_hub import snapshot_download; from pathlib import Path; snapshot_download('sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2', cache_dir=str(Path.home() / 'models'), ignore_patterns=['onnx/*', 'openvino/*', '*.h5', '*.ot'])"
      - name: Full safe suite with cached embeddings
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          PYTHONUTF8: '1'
        run: python -m pytest -q -rA -k 'not autostart and not TestWatcher'

  vlm-integration:
    # Audit F8: real-captioning lane. Downloads SmolVLM weights, then runs the
    # vlm_integration tests in REQUIRED mode: a missing/pruned cache FAILS
    # this lane loudly instead of skipping forever, so broken visual
    # ingestion can never hide behind permanent skips.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]' 'lancedb==0.34.0'
      - name: Cache real SmolVLM weights
        run: python -c "from huggingface_hub import snapshot_download; from pathlib import Path; snapshot_download('HuggingFaceTB/SmolVLM-256M-Instruct', cache_dir=str(Path.home() / 'models'), ignore_patterns=['*.h5', '*.ot', 'onnx/*', 'openvino/*'])"
      - name: Real-VLM captioning from cached weights (required mode)
        env:
          RAG_KIT_VLM_REQUIRED: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          PYTHONUTF8: '1'
        run: python -m pytest tests/test_vlm.py -m vlm_integration -q -rA
