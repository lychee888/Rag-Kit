name: Document lifecycle regressions
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  regression-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install storage and extraction test dependencies
        run: python -m pip install pytest numpy 'lancedb>=0.25' pyarrow typer pyyaml watchdog pillow pymupdf python-docx openpyxl python-pptx
      - name: Test without model downloads or autostart changes
        run: python -m pytest tests/test_document_lifecycle.py tests/test_watchlock.py tests/test_new_features.py -q
